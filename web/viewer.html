<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>어잉티 기보 복기</title>
<link rel="stylesheet" href="gibo-canvas.css"><style>*{box-sizing:border-box}body{margin:0;color:#182b43;font:16px/1.5 system-ui,sans-serif}main{padding:8px}h2{font-size:20px;text-align:center;margin:4px auto 10px}canvas{display:block;max-width:100%;height:auto}#caption{margin:8px auto;padding:9px 14px;background:#182b43;color:#fff;text-align:center;white-space:pre-line;overflow-wrap:anywhere;border-radius:4px}section{max-width:600px;margin:10px auto}section header{display:flex;align-items:center;justify-content:space-between;gap:8px}button{cursor:pointer}section button{border:1px solid #a6b6c8;color:#182b43;background:white;border-radius:4px;padding:6px 10px}section button[aria-pressed=true]{background:#182b43;color:white}output,small{display:block;padding:4px 0}section svg{width:100%;height:72px;background:#eff3f7;cursor:crosshair}section svg[hidden]{display:none}svg line,svg polyline{vector-effect:non-scaling-stroke}</style>
<main><h2></h2><div class="gibo-detail-player"><div class="gibo-stage"><canvas width="600" height="600" data-resources="assets/"></canvas></div><div id="caption" hidden></div></div>
<section><header><strong>AI 승부예측</strong><button type="button" aria-pressed="false">형세 보기</button></header><output></output><svg hidden viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="흑 승률 추이"><line x1="0" x2="100" y1="50" y2="50" stroke="#a4adba"/><polyline fill="none" stroke="#205c91" stroke-width="2"/><line class="cursor" y1="0" y2="100" stroke="#405265"/></svg><small></small></section><div class="gibo-record-info" hidden></div></main>
